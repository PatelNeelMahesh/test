<!DOCTYPE html>
<html>
<head>
<title>Professional Certificate</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap');

    body {
        font-family: 'Roboto', sans-serif;
        background-color: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .certificate-wrapper {
        width: 850px;
        height: 600px;
        background-color: #ffffff;
        border: 1px solid #dcdcdc;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        padding: 50px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .header-section {
        text-align: center;
        margin-bottom: 20px;
    }

    .certificate-logo {
        height: 60px;
        width: auto;
        margin-bottom: 20px;
    }
    
    .certificate-type {
        font-size: 36px;
        font-weight: 700;
        color: #1a237e;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin: 0;
    }

    .certificate-subtext {
        font-size: 18px;
        color: #757575;
        font-style: italic;
        margin-top: 5px;
    }

    .main-content {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
    }

    .award-text {
        font-size: 20px;
        color: #333;
        margin-bottom: 15px;
    }

    .recipient-name {
        font-family: 'Times New Roman', serif; /* Use a classic font for the name */
        font-size: 52px;
        font-weight: 400;
        color: #004d40;
        margin: 0;
    }

    .achievement-details {
        font-size: 22px;
        color: #555;
        line-height: 1.6;
        margin-top: 20px;
    }

    .course-title {
        font-weight: 700;
        color: #1a237e;
    }

    .footer-section {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding-top: 40px;
    }

    .signature-block {
        text-align: center;
    }

    .signature-line {
        height: 1px;
        width: 200px;
        background-color: #333;
        margin-bottom: 8px;
    }

    .signature-label {
        font-size: 14px;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .date-block {
        text-align: right;
    }

    .date-label {
        font-size: 14px;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .date-value {
        font-size: 18px;
        color: #333;
        margin-top: 5px;
    }
</style>
</head>
<body>

<div class="certificate-wrapper">
    <div class="header-section">
        <div class="certificate-type">CERTIFICATE OF COMPLETION</div>
        <div class="certificate-subtext">This certificate is proudly awarded to</div>
    </div>

    <div class="main-content">
        <div class="recipient-name">
            Sahoo Priyabrata Virendrabhai
        </div>
        <div class="achievement-details">
            For successfully completing the <span class="course-title">CSS</span>,
            <br>demonstrating exceptional dedication and expertise.
        </div>
    </div>

    <div class="footer-section">
        <div class="signature-block">
             <i>neel patel</i><div class="signature-line"></div>
            <div class="signature-label">Director of Training</div>
        </div>
        <div class="signature-block">
            04-03-2025<div class="signature-line"></div>
           <div class="signature-label">Date of Issuance</div>
        </div>
    </div>
</div>

</body>
</html>
