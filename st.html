<!DOCTYPE html>
<html>
<head>
<title>Certificate of Achievement</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Old+Standard+TT&display=swap');

    body {
        font-family: 'Old Standard TT', serif;
        background-color: #e6e3dc;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .certificate-frame {
        width: 900px;
        height: 700px;
        background-color: #ffffff;
        border: 1px solid #d4c0a8;
        padding: 50px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        position: relative;
        text-align: center;
    }

    .certificate-border {
        position: absolute;
        top: 20px;
        left: 20px;
        right: 20px;
        bottom: 20px;
        border: 5px solid #a87e5b;
        pointer-events: none;
    }

    .certificate-content {
        padding: 40px;
    }

    .certificate-title {
        font-family: 'Playfair Display', serif;
        font-size: 60px;
        font-weight: 700;
        color: #a87e5b;
        margin-bottom: 5px;
        letter-spacing: 2px;
    }

    .certificate-tagline {
        font-style: italic;
        font-size: 20px;
        color: #555;
        margin-bottom: 40px;
    }

    .certificate-award-text {
        font-size: 24px;
        color: #444;
        margin-bottom: 10px;
    }
    
    .certificate-recipient {
        font-family: 'Playfair Display', serif;
        font-size: 48px;
        font-weight: 400;
        color: #333;
        margin-bottom: 20px;
    }

    .certificate-details {
        font-size: 20px;
        color: #555;
        line-height: 1.5;
        margin-bottom: 50px;
        padding: 0 50px;
    }

    .certificate-course {
        font-weight: bold;
        color: #a87e5b;
    }

    .signature-container {
        display: flex;
        justify-content: space-around;
        align-items: flex-end;
        margin-top: 50px;
    }

    .signature-block {
        text-align: center;
    }

    .signature-line {
        width: 250px;
        height: 1px;
        background-color: #333;
        margin-bottom: 5px;
    }

    .signature-label {
        font-size: 16px;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .certificate-date {
        margin-top: 40px;
        font-size: 18px;
        color: #777;
    }

</style>
</head>
<body>

<div class="certificate-frame">
    <div class="certificate-border"></div>
    <div class="certificate-content">
        <div class="certificate-title">CERTIFICATE</div>
        <div class="certificate-tagline">of Recognition</div>
        
        <div class="certificate-award-text">This esteemed award is presented to</div>
        
        <div class="certificate-recipient">[Recipient's Name]</div>
        
        <div class="certificate-details">
            In recognition of their successful completion of the
            <br>
            <span class="certificate-course">[Course Name]</span>
            <br>
            on this day, proving their dedication and commitment to excellence.
        </div>

        <div class="signature-container">
            <div class="signature-block">
                <div class="signature-line"></div>
                <div class="signature-label">Director's Signature</div>
            </div>
            <div class="signature-block">
                <div class="signature-line"></div>
                <div class="signature-label">Date</div>
            </div>
        </div>
        
        <div class="certificate-date">
            [Date of Completion]
        </div>
    </div>
</div>

</body>
</html>
